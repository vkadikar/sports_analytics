# Vercel build config for the League Hub (soccer/league_hub). Setup notes: soccer/league_hub/README.md
[project]
name = "league-hub"
version = "0.1.0"
requires-python = ">=3.14"
# Keep in sync with soccer/league_hub/requirements.txt, which Render and the News action install.
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "tzdata>=2024.1",
    "google-genai>=1.0.0",
    "mcp>=2.3.0",
]

[tool.vercel]
entrypoint = "soccer.league_hub.app:app"
