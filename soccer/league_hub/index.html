<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gentlemen's Invitational Hub</title>
  <meta name="description" content="Official league hub for The Gentlemen's Invitational Fantasy Premier League, 2026–27.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem("gi-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="League hub home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l4 2.9-1.5 4.7h-5L8 10.4z"/><path d="M12 3v4.5M16 10.4l4.3-1.4M14.5 15.1l2.6 3.8M9.5 15.1l-2.6 3.8M8 10.4L3.7 9"/></svg>
        </span>
        <span class="brand-text"><strong>Gentlemen's Invitational</strong><span>Fantasy Prem 26–27</span></span>
      </a>
      <nav class="main-nav" aria-label="Primary" data-nav></nav>
      <div class="header-actions">
        <button class="icon-btn search-btn" id="open-search" aria-label="Search managers and clubs">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <span class="label">Search</span><span class="kbd">⌘K</span>
        </button>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle colour theme">
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <nav class="mobile-nav" aria-label="Primary (mobile)" data-nav></nav>
  </header>

  <main>
    <section class="page" id="page-home" aria-labelledby="t-home"></section>
    <section class="page" id="page-news" aria-labelledby="t-news"></section>
    <section class="page" id="page-table" aria-labelledby="t-table"></section>
    <section class="page" id="page-matches" aria-labelledby="t-matches"></section>
    <section class="page" id="page-cups" aria-labelledby="t-cups"></section>
    <section class="page" id="page-managers" aria-labelledby="t-managers"></section>
    <section class="page" id="page-history" aria-labelledby="t-history"></section>
    <section class="page" id="page-rules" aria-labelledby="t-rules"></section>
  </main>

  <footer class="footer">
    The Gentlemen's Invitational · Fantasy Prem 2026–27 · Data synced from Fantrax league <span id="footer-league"></span><span id="footer-synced"></span>
  </footer>

  <!-- Manager dossier -->
  <div class="overlay" id="mgr-overlay" role="dialog" aria-modal="true" aria-label="Manager dossier">
    <div class="card modal" id="mgr-modal"></div>
  </div>

  <!-- Matchup lineups -->
  <div class="overlay" id="match-overlay" role="dialog" aria-modal="true" aria-label="Matchup lineups">
    <div class="card modal modal-wide" id="match-modal"></div>
  </div>

  <!-- Command palette -->
  <div class="overlay" id="search-overlay" role="dialog" aria-modal="true" aria-label="Search">
    <div class="card palette">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search-input" type="text" placeholder="Search managers, clubs, pages…" autocomplete="off" aria-label="Search">
        <span class="kbd">ESC</span>
      </div>
      <div class="palette-list" id="search-results" role="listbox"></div>
    </div>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>

  <!-- Commish Bot -->
  <button class="commish-fab" id="commish-fab" aria-label="Chat with Commish Bot" aria-expanded="false">
    <span class="commish-fab-icon">
      <svg class="i-bot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5V3"/><circle cx="12" cy="2.2" r="1.2" fill="currentColor" stroke="none"/><rect x="4" y="5" width="16" height="13" rx="4"/><path d="M2 10v3M22 10v3"/><circle cx="9" cy="10.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.4" fill="currentColor" stroke="none"/><path d="M8.5 14.2c2 1.6 5 1.6 7 0"/><path d="M9 21h6"/></svg>
      <svg class="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </span>
    <span class="commish-fab-label">Commish Bot</span>
  </button>

  <div class="commish-panel" id="commish-panel" role="dialog" aria-modal="false" aria-label="Commish Bot chat">
    <div class="commish-head">
      <span class="commish-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5V3"/><circle cx="12" cy="2.2" r="1.2" fill="currentColor" stroke="none"/><rect x="4" y="5" width="16" height="13" rx="4"/><path d="M2 10v3M22 10v3"/><circle cx="9" cy="10.5" r="1.4" fill="currentColor" stroke="none"/><circle cx="15" cy="10.5" r="1.4" fill="currentColor" stroke="none"/><path d="M8.5 14.2c2 1.6 5 1.6 7 0"/><path d="M9 21h6"/></svg>
      </span>
      <div class="commish-head-text">
        <div class="ttl">Commish Bot</div>
        <label class="sub commish-who-label"><span class="dot"></span><span class="sr-only">You are</span>
          <select id="commish-who" aria-label="Which manager are you?">
            <option value="" disabled selected>Who are you?</option>
          </select>
        </label>
      </div>
      <div class="commish-actions">
        <button class="icon-btn" id="commish-expand" aria-label="Full screen" aria-pressed="false">
          <svg class="i-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
          <svg class="i-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>
        </button>
        <button class="icon-btn" id="commish-close" aria-label="Close chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
    <div class="commish-body" id="commish-body"></div>
    <form class="commish-foot" id="commish-form">
      <input id="commish-input" type="text" placeholder="Pick your team first" autocomplete="off" aria-label="Message Commish Bot" disabled>
      <button type="submit" id="commish-send" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </div>

  <!-- Markdown rendering for Commish Bot replies; output is sanitized with DOMPurify -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
